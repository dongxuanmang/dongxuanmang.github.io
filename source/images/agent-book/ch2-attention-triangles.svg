<rect x="346" y="286" width="136" height="136" fill="none" stroke="#7a5800" stroke-width="2" stroke-dasharray="5 4" rx="6"/>
<text x="338" y="280" text-anchor="end" font-size="13" font-weight="700" fill="#7a5800">① 思考的三角形</text>
<rect x="346" y="422" width="136" height="136" fill="none" stroke="#2f9e6e" stroke-width="2" stroke-dasharray="5 4" rx="6"/>
<text x="490" y="442" text-anchor="start" font-size="13" font-weight="700" fill="#2f9e6e">② 输出的三角形</text>
<rect x="680" y="180" width="16" height="16" rx="3" fill="#c8992e"/>
<text x="706" y="193" font-size="14.5" font-weight="700" fill="#2b2b2b">① 思考的三角形</text>
<text x="680" y="216" font-size="12.5" fill="#5c5650">生成新的思考时，回看之前</text>
<text x="680" y="235" font-size="12.5" fill="#5c5650">的思考内容和工具定义（题目条件）</text>
<text x="680" y="254" font-size="12.5" fill="#5c5650">——写了多少步，回看范围就有多大</text>
<rect x="680" y="300" width="16" height="16" rx="3" fill="#c8992e"/>
<text x="704" y="313" font-size="14.5" font-weight="700" fill="#2b2b2b">② 输出的三角形</text>
<text x="680" y="336" font-size="12.5" fill="#5c5650">输出回答时，注意力转向思考区：</text>
<text x="680" y="355" font-size="12.5" fill="#5c5650">把思考过程当提示词，对着草稿</text>
<text x="680" y="374" font-size="12.5" fill="#5c5650">誊写正式答案（引用工具结果）</text>
<rect x="680" y="410" width="16" height="16" rx="3" fill="#8a6d1f"/>
<text x="704" y="423" font-size="14.5" font-weight="700" fill="#2b2b2b">第 1 个 token · 注意力储存池</text>
<text x="680" y="446" font-size="12.5" fill="#5c5650">softmax 强制注意力总和为 100%，</text>
<text x="680" y="465" font-size="12.5" fill="#5c5650">多余的权重集中倾倒到开头固定位置</text>
<rect x="680" y="500" width="16" height="16" rx="3" fill="#ddd5bd"/>
<text x="704" y="513" font-size="14.5" font-weight="700" fill="#2b2b2b">浅色 = 弱相关</text>
<text x="680" y="523" font-size="12.5" fill="#5c5650">输出段落内部、前缀 token 之间</text>
<text x="680" y="542" font-size="12.5" fill="#5c5650">的互相关，权重低</text>
<rect x="50" y="580" width="800" height="52" rx="12" fill="#fffdf5" stroke="#b8860b" stroke-width="1.2"/>
<text x="450" y="602" text-anchor="middle" font-size="14.5" font-weight="700" fill="#7a5800">输出是「看着思考」生成的 —— 草稿被拿走，三角形②就没有了落脚点</text>
<text x="450" y="622" text-anchor="middle" font-size="12.5" fill="#96762f">这正是 Agent 场景必须原样回传思维链（DeepSeek V4、Claude thinking block）的原因</text>
</svg>